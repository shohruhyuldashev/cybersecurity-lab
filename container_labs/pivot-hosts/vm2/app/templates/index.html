<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>InternalAPI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem}
.logo{display:flex;align-items:center;gap:.75rem;font-size:1.5rem;font-weight:700}
.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.info{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:1.5rem 2rem;text-align:center;max-width:440px}
.info h2{font-size:1rem;margin-bottom:.5rem;color:#8b949e;font-weight:400}
a.btn{display:inline-block;padding:.6rem 1.5rem;background:#2563eb;color:#fff;border-radius:6px;text-decoration:none;font-size:.875rem;font-weight:600;margin-top:1rem}
</style>
</head>
<body>
<div class="logo"><div class="logo-icon">⚡</div> InternalAPI</div>
<div class="info">
  <h2>Internal API Service v1.4.0</h2>
  <p style="color:#484f58;font-size:.85rem">Restricted access — authentication required</p>
  <a class="btn" href="/login">Sign In →</a>
</div>
</body>
</html>
