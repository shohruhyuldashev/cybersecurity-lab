{% extends 'base.html' %}

{% block content %}
<h2>Lab 1 — ID-based injection</h2>
<form>
  <label>Product id: <input name="id" value="1"></label>
  <button>Lookup</button>
</form>
<h3>Results</h3>
{% if rows %}
<table>
  <tr>
    <th>id</th>
    <th>name</th>
    <th>description</th>
  </tr>
  {% for r in rows %}
  <tr>
    <td>{{ r['id'] }}</td>
    <td>{{ r['name'] }}</td>
    <td>{{ r['description'] }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p class="muted">No rows</p>
{% endif %}
{% endblock %}
