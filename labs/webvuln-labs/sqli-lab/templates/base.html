<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SQLi Labs</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #111827;
      --accent: #22d3ee;
      --accent2: #ef4444;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, #0b1220, #071027);
      color: var(--text);
      padding: 40px 20px;
      min-height: 100vh;
    }

    .card {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 950px;
      margin: 0 auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: var(--accent);
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    nav a {
      text-decoration: none;
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.6);
      transition: all 0.25s ease;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    nav a:hover {
      background: rgba(34, 211, 238, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
      transform: translateY(-1px);
    }

    nav a.active {
      background: rgba(34, 211, 238, 0.15);
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
    }

    hr {
      margin: 15px 0 25px 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .muted {
      color: var(--muted);
    }

    pre {
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      overflow: auto;
      border: 1px solid var(--border);
      color: #38bdf8;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      text-align: left;
      background: #0f172a;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
    }

    td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: rgba(34, 211, 238, 0.05);
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      outline: none;
      transition: 0.2s ease;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s ease;
    }

    button:hover {
      background: #06b6d4;
      transform: translateY(-2px);
    }

    .alert {
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--accent2);
    }

    .success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      opacity: 0.6;
    }

    /* ===== LAB GRID ===== */

    .labs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .lab-card {
      display: block;
      background: linear-gradient(145deg, #0f172a, #0b1220);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 25px;
      text-decoration: none;
      transition: 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .lab-card h3 {
      margin-bottom: 8px;
      color: #22d3ee;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .lab-card p {
      color: #94a3b8;
      font-size: 14px;
    }

    .lab-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(34, 211, 238, 0.1), transparent);
      transition: 0.5s;
    }

    .lab-card:hover::before {
      left: 100%;
    }

    .lab-card:hover {
      transform: translateY(-5px);
      border-color: #22d3ee;
      box-shadow: 0 10px 40px rgba(34, 211, 238, 0.2);
    }
  </style>

</head>

<body>
  <div class="card">
    <h1>SQLi Labs</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/lab1">Lab 1</a>
      <a href="/lab2">Lab 2</a>
      <a href="/lab3">Lab 3</a>
      <a href="/lab4">Lab 4</a>
      <a href="/lab5">Lab 5</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
  </div>
  <script>
    document.querySelectorAll('nav a').forEach(a => {
      if (a.pathname === location.pathname) a.classList.add('active');
    });
  </script>
</body>

</html>
