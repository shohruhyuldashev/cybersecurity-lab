<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RCE Labs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="card">
        <h1>RCE Labs</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/lab1">Command Injection</a>
            <a href="/lab2">Eval</a>
            <a href="/lab3">SSTI</a>
            <a href="/lab4">Deserialization</a>
            <a href="/lab5">File Include</a>
        </nav>
        <hr>
        {% block content %}{% endblock %}
    </div>
    <script>
        document.querySelectorAll('nav a').forEach(a => {
            if (a.pathname === location.pathname) a.classList.add('active');
        });
    </script>
</body>

</html>
