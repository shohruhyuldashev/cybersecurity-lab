<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lab 5 – LFI Labs</title>
  <style>
    :root{--card:#111827;--accent:#a78bfa;--accent2:#ef4444;--text:#e5e7eb;--muted:#94a3b8;--border:rgba(255,255,255,0.05);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#0b1220,#0d0b1f);color:var(--text);padding:40px 20px;min-height:100vh;}
    .card{background:var(--card);padding:30px;border-radius:12px;border:1px solid var(--border);max-width:950px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
    h1{font-size:28px;margin-bottom:15px;color:var(--accent);letter-spacing:1px;}
    nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px;}
    nav a{text-decoration:none;color:var(--muted);padding:8px 18px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(15,23,42,0.6);transition:all 0.25s ease;font-size:14px;}
    nav a:hover,nav a.active{background:rgba(167,139,250,0.15);border-color:var(--accent);color:var(--accent);}
    hr{margin:15px 0 25px 0;border:none;border-top:1px solid var(--border);}
    .muted{color:var(--muted);}
    pre{background:#020617;padding:15px;border-radius:8px;overflow:auto;border:1px solid var(--border);color:#38bdf8;font-size:13px;white-space:pre-wrap;word-break:break-all;}
    input[type="text"]{width:100%;padding:10px;margin:8px 0;background:#0f172a;border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;font-family:inherit;}
    input:focus{border-color:var(--accent);}
    button{background:var(--accent);color:#000;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-weight:bold;font-family:inherit;transition:0.2s;}
    button:hover{background:#8b5cf6;}
    .alert{padding:10px;border-radius:6px;margin-top:10px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--accent2);}
    .info-box{background:#0f172a;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:20px;font-size:14px;}
    .info-box h2{color:var(--accent);margin-bottom:8px;font-size:16px;}
    .hint{background:rgba(167,139,250,0.05);border:1px solid rgba(167,139,250,0.15);border-radius:8px;padding:12px 16px;margin-top:20px;font-size:13px;color:var(--muted);}
    .hint strong{color:var(--accent);}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-bottom:10px;font-weight:bold;}
    .badge-hard{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);}
    .output-box{background:#020617;border:1px solid rgba(167,139,250,0.2);border-radius:8px;padding:16px;margin-top:16px;}
    .output-box h4{color:var(--accent);font-size:13px;margin-bottom:8px;}
    .pipeline{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
    .pipe-row{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;font-size:13px;}
    .pipe-label{color:var(--muted);text-align:right;padding-top:6px;}
    .pipe-val{background:#020617;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;word-break:break-all;}
    .pipe-val.ok{border-color:rgba(34,197,94,0.4);color:#4ade80;}
    .pipe-val.warn{border-color:rgba(251,191,36,0.4);color:#fbbf24;}
    .pipe-val.cut{border-color:rgba(239,68,68,0.4);color:#f87171;}
    .calc-box{background:#020617;border:1px solid rgba(167,139,250,0.15);border-radius:8px;padding:14px;margin-top:12px;font-size:13px;}
    .calc-box h5{color:#a78bfa;margin-bottom:8px;}
    .warn-box{background:rgba(251,191,36,0.05);border:1px solid rgba(251,191,36,0.2);border-radius:8px;padding:12px;margin-top:10px;font-size:13px;color:#fbbf24;}
    footer{margin-top:30px;text-align:center;color:var(--muted);font-size:13px;opacity:0.6;}
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 LFI Labs</h1>
    <nav>
      <a href="/">Home</a><a href="/lab1">Lab 1</a><a href="/lab2">Lab 2</a>
      <a href="/lab3">Lab 3</a><a href="/lab4">Lab 4</a><a href="/lab5">Lab 5</a>
    </nav>
    <hr>

    <span class="badge badge-hard">HARD</span>
    <div class="info-box">
      <h2>Lab 5 — Path Truncation Bypass</h2>
    </div>

    <form method="GET" style="margin-top:16px;">
      <div style="display:flex;gap:8px;">
        <input type="text" name="page" value="{{ page }}"
          placeholder="File Name">
        <button type="submit">O'qi →</button>
      </div>
    </form>

    {% if content %}
    <div class="output-box">
      <h4>📄 {{ full_path }}</h4>
      <pre style="background:transparent;border:none;padding:0;color:#22c55e;">{{ content }}</pre>
    </div>
    {% endif %}
    {% if error %}<div class="alert" style="margin-top:12px;">⚠ {{ error }}</div>{% endif %}

    <div class="hint">
      <strong>💡 Topshiriq : /etc/flag5</strong><br><br>
    </div>
    <footer>LFI Labs — Ta'lim maqsadida yaratilgan</footer>
  </div>
  <script>document.querySelectorAll('nav a').forEach(a=>{if(a.pathname===location.pathname)a.classList.add('active');});</script>
</body>
</html>
