<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XSS Labs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1 class="brand">XSS Labs</h1>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/lab1">Reflected</a>
        <a href="/lab2">Stored</a>
        <a href="/lab3">DOM</a>
        <a href="/lab4">Attribute</a>
        <a href="/lab5">Image</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Run this lab in an isolated environment. Intentionally vulnerable code.</div>
  </footer>
  <script>
    document.querySelectorAll('.main-nav a').forEach(a => {
      if (a.pathname === location.pathname) a.classList.add('active');
    });
  </script>
</body>

</html>
